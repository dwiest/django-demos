name: Deploy demos to EC2

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: ec2-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: ec2-production
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
      - name: Build dependency-free application wheel
        run: |
          python -m pip install build==1.2.2.post1 setuptools==67.8.0 wheel==0.42.0
          python -m build --wheel --no-isolation
          python - <<'PY'
          import pathlib, zipfile
          wheels = list(pathlib.Path('dist').glob('*.whl'))
          assert len(wheels) == 1
          with zipfile.ZipFile(wheels[0]) as wheel:
              names = wheel.namelist()
              assert any('/invoicer/' in name and name.endswith('.html') for name in names)
              assert 'dwiest/django/demos/invoicer/views.py' in names
          PY
      - uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708 # v5
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1
          role-session-name: django-demos-${{ github.run_id }}
      - name: Upload release and deploy through Systems Manager
        env:
          AWS_REGION: us-east-1
          ARTIFACT_BUCKET: dwiest-artifacts
          INSTANCE_ID: i-0169208b66edd709c
        run: |
          python -m pip install boto3==1.35.99
          python deploy/ssm-deploy.py
