name: Bookmarks AI tests
on:
  pull_request:
    paths:
      - 'dwiest/django/demos/bookmarks/**'
      - 'dwiest/django/demos/migrations/0009_bookmark_ai.py'
      - 'dwiest/django/demos/migrations/0010_bookmark_ai_blocked_domains.py'
      - 'dwiest/django/demos/migrations/0011_bookmark_ai_attempt.py'
      - 'dwiest/django/demos/migrations/0012_bookmark_enrichment.py'
      - 'dwiest/django/demos/models.py'
      - 'dwiest/django/demos/bookmark_ai_models.py'
      - 'dwiest/django/demos/management/**'
      - 'dwiest/django/demos/test_bookmarks_ai_settings.py'
      - 'dwiest/django/demos/templates/dwiest-django-demos/bookmarks/**'
      - 'dwiest/django/demos/static/dwiest-django-demos/bookmarks/**'
      - '.github/workflows/bookmarks-ai-tests.yml'
      - 'setup.cfg'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        python: ['3.7', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install 'Django>=3.2,<3.3' 'djangorestframework>=3.14,<3.15' 'cryptography>=3.4.8' django-appconf qrcode boto3
      - run: python -m django test dwiest.django.demos.bookmarks.test_ai dwiest.django.demos.bookmarks.test_ai_migrations dwiest.django.demos.bookmarks.test_enrichment --settings=dwiest.django.demos.test_bookmarks_ai_settings -v 2
      - run: python -m django test dwiest.django.demos.inventory.tests dwiest.django.demos.inventory.test_umbrella_migrations --settings=dwiest.django.demos.inventory.test_umbrella_settings -v 1
