name: File Manager S3 and DynamoDB tests
on:
  pull_request:
    paths:
      - 'dwiest/django/demos/file/**'
      - 'dwiest/django/demos/templates/dwiest-django-demos/file/**'
      - 'dwiest/django/demos/static/dwiest-django-demos/file/**'
      - 'dwiest/django/demos/management/commands/*file_manager.py'
      - 'deploy/file-manager.yaml'
      - 'tests/file-upload.test.cjs'
      - '.github/workflows/file-manager-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'Django>=3.2,<3.3' 'djangorestframework>=3.14,<3.15' 'cryptography>=3.4.8' django-appconf qrcode boto3 'channels>=3,<4' 'moto[s3,dynamodb]>=5,<6' cfn-lint
      - run: python -m django test dwiest.django.demos.file.tests dwiest.django.demos.test_application_access --settings=dwiest.django.demos.test_application_settings -v 2
      - run: cfn-lint deploy/file-manager.yaml
      - run: node --check dwiest/django/demos/static/dwiest-django-demos/file/upload.js
      - run: node --test tests/file-upload.test.cjs
