name: Inventory MCP tests
on:
  pull_request:
    paths:
      - 'integrations/inventory-mcp/**'
      - '.github/workflows/inventory-mcp-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r integrations/inventory-mcp/requirements.txt
      - run: python -m unittest discover -s integrations/inventory-mcp -v
      - run: python integrations/inventory-mcp/build.py
