<section class="news-panel news-feed" aria-labelledby="feed-heading">
  <div class="page-heading"><h2 id="feed-heading">Live feed</h2><span id="connection-status" class="news-status" role="status">Disconnected</span></div>
  <div id="news" class="news-output" role="status" aria-live="polite">Connect to start receiving news.</div>
  <div class="news-controls">
    <button id="connect" class="button primary" type="button">Connect</button>
    <button id="getNews" class="button secondary" type="button" disabled>Pause news</button>
    <label for="speed">Interval (seconds)<input class="control" id="speed" type="number" min="1" max="5" step="1" value="3"></label>
    <button id="disconnect" class="button secondary" type="button" disabled>Disconnect</button>
  </div>
  <details class="news-endpoint"><summary>Connection details</summary><code id="endpoint"></code></details>
</section>
<script>
(() => {
  const output = document.getElementById('news');
  const status = document.getElementById('connection-status');
  const connect = document.getElementById('connect');
  const disconnect = document.getElementById('disconnect');
  const pause = document.getElementById('getNews');
  const interval = document.getElementById('speed');
  const endpoint = 'wss://ws.' + window.location.host + '/django/ws/demos/news/';
  document.getElementById('endpoint').textContent = endpoint;
  let socket = null;
  let timer = null;
  let paused = false;
  let pending = false;
  let speed = 3;
  function cancelTimer() { clearTimeout(timer); timer = null; }
  function requestNews() {
    cancelTimer();
    if (!paused && !pending && socket && socket.readyState === WebSocket.OPEN) {
      pending = true;
      socket.send('1');
    }
  }
  function scheduleNews() {
    cancelTimer();
    if (!paused) timer = setTimeout(requestNews, speed * 1000);
  }
  function reset(message) {
    cancelTimer();
    pending = false;
    connect.disabled = false;
    disconnect.disabled = true;
    pause.disabled = true;
    status.textContent = message;
  }
  connect.addEventListener('click', () => {
    if (socket && socket.readyState !== WebSocket.CLOSED) return;
    connect.disabled = true;
    status.textContent = 'Connecting…';
    paused = false;
    pause.textContent = 'Pause news';
    try { socket = new WebSocket(endpoint); }
    catch (error) { reset('Unable to connect. Try again.'); return; }
    socket.addEventListener('open', () => {
      status.textContent = 'Connected';
      disconnect.disabled = false;
      pause.disabled = false;
      output.textContent = 'Waiting for news…';
      requestNews();
    });
    socket.addEventListener('message', event => {
      pending = false;
      output.textContent = event.data;
      scheduleNews();
    });
    socket.addEventListener('error', () => {
      status.textContent = 'Connection error. Check that the feed service is available.';
    });
    socket.addEventListener('close', event => {
      reset(event.wasClean ? 'Disconnected' : 'Connection lost. Check that the feed service is available, then reconnect.');
    });
  });
  disconnect.addEventListener('click', () => {
    cancelTimer();
    disconnect.disabled = true;
    pause.disabled = true;
    status.textContent = 'Disconnecting…';
    if (socket) socket.close();
  });
  pause.addEventListener('click', () => {
    paused = !paused;
    pause.textContent = paused ? 'Resume news' : 'Pause news';
    status.textContent = paused ? 'Connected · Paused' : 'Connected';
    if (paused) cancelTimer(); else requestNews();
  });
  interval.addEventListener('change', () => {
    const value = Number(interval.value);
    speed = Number.isFinite(value) ? Math.min(5, Math.max(1, Math.round(value))) : 3;
    interval.value = speed;
    if (socket && socket.readyState === WebSocket.OPEN && !pending) scheduleNews();
  });
  window.addEventListener('pagehide', () => { cancelTimer(); if (socket) socket.close(); });
})();
</script>
