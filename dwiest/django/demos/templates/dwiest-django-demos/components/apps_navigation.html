<details class="ww-apps ww-nav-menu" data-nav-menu>
  <summary><svg width="18" height="18" viewBox="0 0 18 18" fill="currentColor" aria-hidden="true"><path d="M1 1h4v4H1zm6 0h4v4H7zm6 0h4v4h-4zM1 7h4v4H1zm6 0h4v4H7zm6 0h4v4h-4zM1 13h4v4H1zm6 0h4v4H7zm6 0h4v4h-4z"/></svg>Apps</summary>
  <nav class="ww-apps-panel" aria-label="Apps">
    <a class="ww-apps-home" href="{{ apps_home_url }}"{% if request.path == apps_home_url %} aria-current="page"{% endif %}><span aria-hidden="true">⌂</span> Home</a>
    <div class="ww-apps-groups">
      <section class="ww-apps-applications" aria-label="Applications">
        <h2>Applications</h2>
        <div class="ww-apps-grid">
          <a href="{% url 'demos:bookmarks:home' %}"{% if demo_section == 'bookmarks' or 'bookmarks' in request.resolver_match.namespaces %} aria-current="true"{% endif %}>Bookmarks</a>
          <a href="{% url 'demos:invoicer:home' %}"{% if demo_section == 'invoicer' or 'invoicer' in request.resolver_match.namespaces %} aria-current="true"{% endif %}>Invoicer</a>
          <a href="{% url 'demos:journal:home' %}"{% if demo_section == 'journal' or 'journal' in request.resolver_match.namespaces %} aria-current="true"{% endif %}>Journal</a>
          <a href="{% url 'demos:qrcode:home' %}"{% if demo_section == 'qrcode' or 'qrcode' in request.resolver_match.namespaces %} aria-current="true"{% endif %}>QR Code</a>
          <a href="{% url 'demos:otp:home' %}"{% if demo_section == 'otp' or 'otp' in request.resolver_match.namespaces %} aria-current="true"{% endif %}>Time-Based OTP</a>
          <a href="{% url 'demos:expenses:home' %}"{% if demo_section == 'expenses' or 'expenses' in request.resolver_match.namespaces %} aria-current="true"{% endif %}>Expenses</a>
          <a href="{% url 'demos:inventory:home' %}"{% if demo_section == 'inventory' or 'inventory' in request.resolver_match.namespaces %} aria-current="true"{% endif %}>Inventory</a>
          <a href="{% url 'demos:file:index' %}"{% if demo_section == 'file' or 'file' in request.resolver_match.namespaces %} aria-current="true"{% endif %}>File Manager</a>
          <a href="{% url 'demos:news:home' %}"{% if demo_section == 'news' or 'news' in request.resolver_match.namespaces %} aria-current="true"{% endif %}>WebSockets</a>
          <a href="{% url 'demos:selenium:home' %}"{% if demo_section == 'selenium' or 'selenium' in request.resolver_match.namespaces %} aria-current="true"{% endif %}>Selenium</a>
          <a href="{% url 'demos:store:home' %}"{% if demo_section == 'store' or 'store' in request.resolver_match.namespaces %} aria-current="true"{% endif %}>Store</a>
        </div>
      </section>
      {% if apps_services %}
      <section class="ww-apps-services" aria-label="Services">
        <h2>Services</h2>
        <a href="/django/home/#services">Local services</a>
        <a href="https://wiest.world/voicemail/">Voicemail</a>
        <a href="https://wiest.world/messages/">Messages</a>
      </section>
      {% endif %}
    </div>
  </nav>
</details>
{% include 'dwiest-django-demos/components/navigation.js' %}
