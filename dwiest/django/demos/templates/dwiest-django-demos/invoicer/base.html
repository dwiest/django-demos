{% load static %}<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Invoicer</title>
  <link rel="stylesheet" href="{% static 'dwiest-django-demos/bookmarks/ui.css' %}">
  <link rel="stylesheet" href="{% static 'dwiest-django-demos/invoicer/ui.css' %}">
  <script defer src="{% static 'dwiest-django-demos/invoicer/app.js' %}"></script>
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <header class="site-header"><nav class="nav container" aria-label="Invoicer navigation">
    <a class="brand" href="{% url 'demos:invoicer:home' %}">Invoicer</a>
    <a class="nav-link" href="{% url 'demos:invoicer:invoice_index' %}">Invoices</a>
    <a class="nav-link" href="{% url 'demos:invoicer:bill_to_index' %}">Clients</a>
    <div class="nav-actions"><a href="{% url 'demos:bookmarks:home' %}">Bookmarks</a></div>
  </nav></header>
  <main id="main" class="container">
    {% for message in messages %}<div class="notice" role="status">{{ message }}</div>{% endfor %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
