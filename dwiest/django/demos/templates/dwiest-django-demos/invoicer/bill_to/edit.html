{% extends "dwiest-django-demos/invoicer/base.html" %}
{% block content %}
<div class="page-heading"><div><h1>{% if form.instance.id %}Edit client{% else %}Add client{% endif %}</h1></div></div>
<form method="post" action="{% url 'demos:invoicer:bill_to_edit' %}">
{% csrf_token %}{% if form.instance.id %}<input type="hidden" name="id" value="{{ form.instance.id }}">{% endif %}
<section class="panel"><h2>Client details</h2>{% include "dwiest-django-demos/invoicer/fields.html" %}</section>
<div class="save-actions"><button class="button primary" type="submit">Save client</button><a class="button secondary" href="{% url 'demos:invoicer:bill_to_index' %}">Cancel</a></div></form>
{% endblock %}
