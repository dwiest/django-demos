<form class="panel journal-filter" action="{% url 'demos:journal:view' %}" method="get">
  <input type="hidden" name="id" value="{{ id }}">
  <fieldset>
    <legend>Filter entries</legend>
    <div class="filter-options">
      {% for choice in filter.filter %}<label for="{{ choice.id_for_label }}">{{ choice.tag }} {% if choice.choice_label == 'None' %}All entries{% else %}{{ choice.choice_label|capfirst }}{% endif %}</label>{% endfor %}
    </div>
    <div class="date-options">
      <div class="field"><label for="{{ filter.month.id_for_label }}">Month</label>{{ filter.month }}</div>
      <div class="field"><label for="{{ filter.year.id_for_label }}">Year</label>{{ filter.year }}</div>
      <button class="button secondary" type="submit">Apply filters</button>
    </div>
    <div class="filter-options visibility-options">
      <label for="{{ filter.show_hidden.id_for_label }}">{{ filter.show_hidden }} Show hidden</label>
      <label for="{{ filter.show_deleted.id_for_label }}">{{ filter.show_deleted }} Show deleted</label>
    </div>
    {{ filter.errors }}
  </fieldset>
</form>
