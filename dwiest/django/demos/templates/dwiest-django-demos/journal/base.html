{% load static %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Journal{% endblock %}</title>
  <link rel="stylesheet" href="{% static 'dwiest-django-demos/bookmarks/ui.css' %}">
  <link rel="stylesheet" href="{% static 'dwiest-django-demos/journal/ui.css' %}">
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <header class="site-header">
    <nav class="nav container" aria-label="Journal navigation">
      <a class="brand" href="{% url 'demos:journal:home' %}">Journal</a>
      <a class="nav-link selected" href="{% url 'demos:journal:home' %}">Journals</a>
      <div class="nav-actions">
        <a href="{% url 'demos:bookmarks:home' %}">Bookmarks</a>
        <a href="{% url 'demos:invoicer:home' %}">Invoicer</a>
      </div>
    </nav>
  </header>
  <main id="main" class="container">
    {% for message in messages %}<div class="notice" role="status">{{ message }}</div>{% endfor %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
