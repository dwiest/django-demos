<article class="panel journal-entry">
  <header class="entry-heading">
    <h2><a href="{% url 'demos:journal:entry_edit' %}?id={{ entry.id }}">{{ entry.date|date:'l, F j, Y'|default:'Undated entry' }}</a></h2>
    <span class="tag">{% if entry.status == -1 %}Deleted{% elif entry.status == 1 %}Hidden{% else %}Active{% endif %}</span>
  </header>
  <div class="entry-content">{{ entry.content|default:'No content yet.'|linebreaks }}</div>
  {% include 'dwiest-django-demos/journal/journal-stats.html' %}
</article>
