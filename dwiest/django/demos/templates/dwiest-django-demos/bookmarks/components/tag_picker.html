<fieldset class="tag-picker" data-tag-picker><legend>Tags</legend><div class="selected-tags" data-selected-tags aria-label="Selected tags"></div><details><summary>Add or remove tags</summary><label class="sr-only" for="tag-search">Search tags</label><input type="search" id="tag-search" class="control" placeholder="Find a tag…" data-tag-search><div class="tag-options">{% for choice in form.tag_ids %}<div class="tag-option">{{ choice }}</div>{% empty %}<p class="muted">No tags yet. Create tags from the Tags page.</p>{% endfor %}</div><p class="muted" data-no-tags hidden>No matching tags.</p></details>{% for error in form.tag_ids.errors %}<p class="error" role="alert">{{ error }}</p>{% endfor %}</fieldset>
