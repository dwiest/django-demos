<tr><td class="tag-name"><a href="{% url 'demos:bookmarks:home' %}?tag_id={{ tag.pk }}" aria-label="View bookmarks tagged {{ tag.title }}">{% include 'dwiest-django-demos/bookmarks/components/tag_chip.html' %}</a></td><td class="tag-description">{{ tag.description|default:'—' }}</td><td class="tag-bookmarks"><a href="{% url 'demos:bookmarks:home' %}?tag_id={{ tag.pk }}" aria-label="{{ tag.bookmark_count }} active bookmarks tagged {{ tag.title }}">{{ tag.bookmark_count }}<span class="mobile-label"> bookmarks</span></a></td><td class="tag-edit"><a href="{% url 'demos:bookmarks:tag_edit' %}?id={{ tag.pk }}&amp;next={{ next_url|urlencode }}" aria-label="Edit tag {{ tag.title }}">✎ Edit</a></td></tr>
