<fieldset class="multi-tag-filter" data-tag-filter><legend>Tags</legend><p class="muted">Match all selected tags.</p><label class="sr-only" for="filter-tag-search">Find a tag</label><input class="control" type="search" id="filter-tag-search" placeholder="Find a tag…" data-filter-tag-search><div class="tag-filter-options">{% for choice in query.tag_id %}<div class="tag-filter-option">{{ choice }}</div>{% empty %}<p class="muted">No tags available.</p>{% endfor %}</div><p class="muted" data-filter-tag-empty hidden>No matching tags.</p>{{ query.tag_id.errors }}</fieldset>
